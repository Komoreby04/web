<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
  <!-- Incluyendo Font Awesome para los íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #009e69;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-size: cover;
      background-position: center;
    }

    .login-container {
      text-align: center;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    h1 {
      color: #009e69;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      color: #009e69;
      margin-bottom: 5px;
    }

    .input-group input, .input-group select {
      width: 80%; /* Reducido el tamaño del input */
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      margin: 0 auto; /* Centrado */
      display: block;
    }

    .input-group .fa {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #009e69;
    }

    .input-group input {
      padding-left: 30px; /* espacio para el ícono */
    }

    .btn {
      width: 80%; /* Ajuste del tamaño del botón */
      background-color: #009e69;
      color: #fff;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 auto;
      display: block;
    }

    .btn:hover {
      background-color: #04ae75;
    }

    .error-message {
      color: red;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Inicio de Sesión</h1>
    <form id="login-form">
      <!-- Selección del rol -->
      <div class="input-group" id="role-group">
        <label for="role">Seleccionar Rol</label>
        <select id="role" name="role" required>
          <option value="">Seleccione un rol</option>
          <option value="Administrador">Administrador</option>
          <option value="Consultor">Consultor</option>
        </select>
      </div>

      <!-- Campos de Usuario y Contraseña ocultos hasta elegir rol -->
      <div class="input-group hidden" id="username-group">
        <i class="fa fa-user"></i> <!-- Ícono de usuario -->
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div class="input-group hidden" id="password-group">
        <i class="fa fa-lock"></i> <!-- Ícono de candado -->
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn hidden" id="submit-btn">Entrar</button>
    </form>
    <div id="error-message" class="error-message hidden"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const roleSelect = document.getElementById('role');
    const usernameGroup = document.getElementById('username-group');
    const passwordGroup = document.getElementById('password-group');
    const submitBtn = document.getElementById('submit-btn');
    
    // Manejador de cambio en el rol seleccionado
    roleSelect.addEventListener('change', function() {
      const selectedRole = roleSelect.value;
    
      // Si el rol seleccionado es Consultor, redirigir inmediatamente
      if (selectedRole === 'Consultor') {
        console.log("Rol Consultor seleccionado, redirigiendo a /consultor...");  // Depuración
        window.location.href = '/consultor';  // Redirigir a la página del consultor
      } else if (selectedRole === 'Administrador') {
        // Si el rol seleccionado es Administrador, mostrar los campos de usuario y contraseña
        usernameGroup.classList.remove('hidden');
        passwordGroup.classList.remove('hidden');
        submitBtn.classList.remove('hidden');
      } else {
        // Si no se seleccionó un rol válido, ocultar los campos
        usernameGroup.classList.add('hidden');
        passwordGroup.classList.add('hidden');
        submitBtn.classList.add('hidden');
      }
    });
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();  // Evitar el comportamiento predeterminado del formulario

      const role = document.getElementById('role').value;
 
      if (role === 'Administrador') {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        fetch('/login', {
          method: 'POST',
          body: new URLSearchParams({
            username: username,
            password: password,
          }),
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
        })
        .then((response) => response.json())
        .then((data) => {
          console.log("Respuesta procesada:", data);  // Depuración
          if (data.status === 'success') {
            const role = data.role.toLowerCase();  // Normaliza a minúsculas
            if (role === 'administrador') {
              window.location.href = '/menu';  // Redirige al menú
            } else if (role === 'consultor') {
              window.location.href = '/consultor';  // Redirige al consultor
            }
          } else {
            document.getElementById('error-message').textContent = data.message;
            document.getElementById('error-message').classList.remove('hidden');
          }
        })
        .catch((error) => {
          console.error('Error al iniciar sesión:', error);
          document.getElementById('error-message').textContent =
              'Hubo un error en la conexión con el servidor.';
          document.getElementById('error-message').classList.remove('hidden');
        });
      }
    });
  </script>
</body>
</html>
