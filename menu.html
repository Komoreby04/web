<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reporte IVEE</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* Botón de Cerrar sesión */
        .logout-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #016c48;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .logout-btn:hover {
            background-color: #019362;
        }

        .logout-btn i {
            margin-right: 8px;
        }

        /* Imagen en la esquina superior izquierda */
        .corner-image {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 350px; /* Tamaño más grande */
            height: auto;
        }

        /* Contenedor del menú */
        #menu-container {
            background-color: #009e69;
            padding: 10px 0;
            text-align: center;
        }
        #menu {
            display: inline-block;
        }
        #menu h2 {
            color: white;
            margin: 0;
            padding: 0;
            font-size: 24px;
        }

        /* Enlaces del menú */
        #menu a {
            display: inline-block;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
            position: relative;
        }
        #menu a:hover {
            background-color: #007e54;
        }

        /* Submenú */
        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            white-space: nowrap;
            background-color: #009e69;
            border-radius: 5px;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .submenu a {
            display: inline-block;
            padding: 10px 15px;
            color: white;
            text-decoration: none;
        }
        .submenu a:hover {
            background-color: #007e54;
        }
        .has-submenu {
            display: inline-block;
            position: relative;
        }
        .has-submenu:hover .submenu {
            display: inline-flex;
        }

        /* Estilos del iframe */
        iframe {
            width: 100%;
            height: 600px;
            margin: 0;
            display: block;
            border: none;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 0;
        }
    </style>
</head>
<body>

    <!-- Imagen en la esquina superior izquierda -->
    <img class="corner-image" src="static/images/logo.png" alt="Logo Grande">

    <!-- Botón de Cerrar sesión -->
    <button class="logout-btn" onclick="window.location.href='/logout'">
        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
    </button>

    <!-- Menú de navegación centrado -->
    <div id="menu-container">
        <div id="menu">
            <h2>SISTEMA DE REPORTES COBRANZA</h2>
            <a href="/inicio" target="contentFrame">Inicio</a>
            <div class="has-submenu">
                <a href="#" onclick="return false;">Reporte IVEE</a>
                <div class="submenu">
                    <a href="/reporte_ivee" target="contentFrame">Consulta</a>
                    <a href="{{ url_for('mensual_ivee') }}" target="contentFrame">Reporte mensual</a>
                </div>
            </div>
            <!-- <a href="/consulta_cuadre" target="contentFrame">Reporte Cartera</a> -->
            <!-- <a href="CCA.html" target="contentFrame">Programa CCA</a> -->

        </div>
    </div>

    <!-- Contenedor del iframe -->
    <iframe name="contentFrame" src="/inicio"></iframe>

</body>
</html>
