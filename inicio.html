<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .intro-container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .intro-container img {
            width: 120px;
            margin-bottom: 25px;
        }

        .intro-container h1 {
            font-size: 28px;
            color: #009e69;
            margin: 15px 0;
        }

        .intro-container p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .intro-container a {
            text-decoration: none;
            background-color: #388e3c;
            color: white;
            font-size: 18px;
            padding: 12px 25px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .intro-container a:hover {
            background-color: #2c6c29;
        }

    </style>
</head>
<body>

    <div class="intro-container">
        <h1>Bienvenido a Nuestro Sistema</h1>
        <p>Estamos felices de que estés aquí. Explora lo que tenemos para ofrecer.</p>
    </div>

</body>
</html>
